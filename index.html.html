<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --card: #1a1a24;
  --border: #2a2a3a;
  --accent: #c77dff;
  --gold: #ffc83c;
  --text: #e8e8f0;
  --muted: #7878a0;
  --sidebar-w: 210px;
}
body { background: var(--bg); color: var(--text); font-family: "DM Sans", sans-serif; min-height: 100vh; overflow-x: hidden; }

/* HEADER */
header { position: sticky; top: 0; z-index: 100; background: rgba(10,10,15,0.97); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.header-top { padding: 14px 28px; display: flex; align-items: center; gap: 16px; }
.header-title { font-family: "Playfair Display", serif; font-size: 1.4rem; font-weight: 700; white-space: nowrap; }
.header-title span { color: var(--accent); }
.header-divider { flex: 1; }
.search-wrap { position: relative; }
.search-input { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 16px 8px 36px; border-radius: 999px; font-size: 13px; font-family: "DM Sans", sans-serif; outline: none; transition: border-color 0.2s; width: 220px; }
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }
.search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }

/* MENU BUTTON (mobile) */
.menu-btn { display: none; background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 8px; font-size: 16px; cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0; }

/* TOP TABS */
.top-tabs { display: flex; padding: 0 28px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--border); background: var(--surface); }
.top-tabs::-webkit-scrollbar { display: none; }
.top-tab { padding: 10px 22px; font-size: 12px; font-weight: 600; font-family: "Oswald", sans-serif; color: var(--muted); background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; transition: all 0.2s; letter-spacing: 0.12em; text-transform: uppercase; }
.top-tab:hover { color: var(--text); }
.top-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.top-tab.exclusivo.active { color: var(--gold); border-bottom-color: var(--gold); }

/* LAYOUT */
.layout { display: flex; min-height: calc(100vh - 105px); position: relative; }

/* SIDEBAR */
.sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 0; position: sticky; top: 105px; height: calc(100vh - 105px); overflow-y: auto; transition: transform 0.25s ease; }
.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.sb-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 18px; font-size: 12px; font-weight: 600; font-family: "Oswald", sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); cursor: pointer; background: none; border: none; border-left: 3px solid transparent; transition: all 0.15s; text-align: left; }
.sb-item:hover { color: var(--text); background: rgba(199,125,255,0.04); }
.sb-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(199,125,255,0.06); }
.sb-icon { font-size: 15px; }

/* SIDEBAR OVERLAY (mobile) */
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }

/* MAIN */
main { flex: 1; padding: 28px 32px 80px; overflow-x: hidden; min-width: 0; }

/* PILLS */
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.pill { padding: 7px 18px; font-size: 11px; font-weight: 500; font-family: "Oswald", sans-serif; letter-spacing: 0.1em; text-transform: uppercase; background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 999px; cursor: pointer; transition: all 0.2s; }
.pill:hover { color: var(--text); border-color: var(--accent); }
.pill.active { background: rgba(199,125,255,0.12); border-color: var(--accent); color: var(--accent); }

/* BLOCKS */
.cat-block { margin-bottom: 44px; scroll-margin-top: 120px; }
.cat-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.cat-label { font-family: "Oswald", sans-serif; font-size: 1rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text); }
.cat-line { flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent); }
.cat-count { font-size: 11px; color: var(--muted); }

/* GRID */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 14px; }
.card { border-radius: 10px; overflow: hidden; background: var(--card); border: 1px solid var(--border); cursor: pointer; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; }
.card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 16px 36px rgba(199,125,255,0.15); }
.card.exclusive { border-color: rgba(255,200,60,0.35); }
.card.exclusive:hover { border-color: var(--gold); box-shadow: 0 16px 36px rgba(255,200,60,0.18); }
.card-poster { position: relative; aspect-ratio: 2/3; overflow: hidden; background: var(--surface); }
.card-poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
.card:hover .card-poster img { transform: scale(1.04); }
.card-poster .no-img { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 30px; }
.badge { position: absolute; top: 8px; right: 8px; background: rgba(10,10,15,0.85); border: 1px solid var(--accent); color: var(--accent); font-size: 9px; padding: 3px 7px; border-radius: 4px; letter-spacing: 0.08em; text-transform: uppercase; font-family: "Oswald", sans-serif; }
.excl-badge { position: absolute; top: 8px; left: 8px; background: rgba(10,10,15,0.85); border: 1px solid var(--gold); color: var(--gold); font-size: 9px; padding: 3px 7px; border-radius: 4px; letter-spacing: 0.08em; font-family: "Oswald", sans-serif; }
.card-info { padding: 9px 10px 11px; }
.card-title { font-size: 12px; font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text); line-height: 1.3; margin-bottom: 4px; }
.card-sub { font-size: 11px; color: var(--muted); }

.empty-msg { text-align: center; color: var(--muted); padding: 60px; font-size: 14px; display: none; }

@media (max-width: 700px) {
  .menu-btn { display: flex; }
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    z-index: 200;
    transform: translateX(-100%);
    box-shadow: 8px 0 24px rgba(0,0,0,0.4);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  main { padding: 16px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .header-title { font-size: 1.15rem; }
  .search-input { width: 150px; }
}

let currentTab = Object.keys(DATA)[0];
let currentSidebar = 0;
let currentPill = "Todos";

function render() {
  renderTabs();
  renderSidebar();
  renderMain();
}

function renderTabs() {
  const tabs = document.getElementById("topTabs");
  tabs.innerHTML = Object.keys(DATA).map((tab, i) => {
    const isExcl = DATA[tab].exclusive;
    const cls = `top-tab${isExcl ? " exclusivo" : ""}${tab === currentTab ? " active" : ""}`;
    const count = DATA[tab].sidebar.reduce((sum, s) => sum + s.groups.reduce((s2, g) => s2 + g.items.length, 0), 0);
    return `<button class="${cls}" onclick="switchTab('${tab}')">${tab} <span style="font-size:10px;opacity:0.6">(${count})</span></button>`;
  }).join("");
}

function switchTab(tab) {
  currentTab = tab;
  currentSidebar = 0;
  currentPill = "Todos";
  render();
  window.scrollTo(0, 0);
  closeSidebar();
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  const tabData = DATA[currentTab];
  sb.innerHTML = tabData.sidebar.map((s, i) => {
    const cls = `sb-item${i === currentSidebar ? " active" : ""}`;
    const count = s.groups.reduce((sum, g) => sum + g.items.length, 0);
    const countBadge = ` <span style="font-size:11px;opacity:0.6">(${count})</span>`;
    return `<button class="${cls}" onclick="switchSidebar(${i})"><span class="sb-icon">${s.icon}</span>${s.label}${countBadge}</button>`;
  }).join("");
}

function switchSidebar(i) {
  currentSidebar = i;
  currentPill = "Todos";
  renderSidebar();
  renderMain();
  closeSidebar();
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("open");
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarOverlay").classList.remove("open");
}

function renderMain() {
  const main = document.getElementById("mainContent");
  const tabData = DATA[currentTab];
  const sideData = tabData.sidebar[currentSidebar];
  if (!sideData) { main.innerHTML = ""; return; }

  const pills = sideData.pills || [];
  const allItems = sideData.groups.flatMap(g => g.items);
  const pillsHtml = pills.length > 1
    ? `<div class="pills">${pills.map(p => {
        const count = p === "Todos"
          ? allItems.length
          : allItems.filter(i => i.country === p).length ||
            sideData.groups.filter(g => g.name === p).flatMap(g => g.items).length;
        const countBadge = count > 0 ? ` <span style="font-size:10px;opacity:0.7">(${count})</span>` : "";
        return `<button class="pill${p === currentPill ? " active" : ""}" onclick="switchPill('${p}')">${p}${countBadge}</button>`;
      }).join("")}</div>`
    : "";

  const groups = sideData.groups.map(g => {
    const filtered = g.items.filter(item =>
      currentPill === "Todos" ||
      (item.country && item.country === currentPill) ||
      (!item.country && g.name === currentPill)
    );
    if (!filtered.length) return "";
    const count = filtered.length;
    const cards = filtered.map(item => cardHtml(item)).join("");
    return `<div class="cat-block">
      <div class="cat-header">
        <span class="cat-label">${g.name}</span>
        <span class="cat-line"></span>
        <span class="cat-count">${count} título${count !== 1 ? "s" : ""}</span>
      </div>
      <div class="grid">${cards}</div>
    </div>`;
  }).join("");

  main.innerHTML = pillsHtml + (groups || `<div style="color:var(--muted);padding:60px;text-align:center">Nenhum título nesta categoria ainda.</div>`);
}

function cardHtml(item) {
  const imgContent = item.img
    ? `<img src="${item.img}" alt="${item.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=no-img>🎬</div>'">`
    : `<div class="no-img">🎬</div>`;
  const exclBadge = item.exclusive ? `<span class="excl-badge">👑 Exclusivo</span>` : "";
  const badge = item.badge ? `<span class="badge">${item.badge}</span>` : "";
  const cls = `card${item.exclusive ? " exclusive" : ""}`;
  return `<div class="${cls}">
    <div class="card-poster">
      ${imgContent}
      ${exclBadge}${badge}
    </div>
    <div class="card-info">
      <div class="card-title">${item.title}</div>
      ${item.sub ? `<div class="card-sub">${item.sub}</div>` : ""}
    </div>
  </div>`;
}

function switchPill(p) {
  currentPill = p;
  renderMain();
}

function filterAll() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  const main = document.getElementById("mainContent");
  const empty = document.getElementById("emptyMsg");
  if (!q) { renderMain(); empty.style.display = "none"; return; }

  let results = [];
  Object.values(DATA).forEach(tab => {
    tab.sidebar.forEach(s => {
      s.groups.forEach(g => {
        g.items.filter(i => i.title.toLowerCase().includes(q)).forEach(i => results.push(i));
      });
    });
  });

  empty.style.display = results.length ? "none" : "block";
  if (!results.length) { main.innerHTML = ""; return; }
  main.innerHTML = `<div class="cat-block">
    <div class="cat-header"><span class="cat-label">Resultados</span><span class="cat-line"></span><span class="cat-count">${results.length}</span></div>
    <div class="grid">${results.map(cardHtml).join("")}</div>
  </div>`;
}

render();
</script>
